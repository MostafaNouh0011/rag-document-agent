[project]
name = "rag-document-agent"
version = "0.1.0"
description = "RAG system that enables users to upload documents and receive grounded, cited answers through a coordinated multi-agent workflow"
readme = "README.md"
authors = [
    { name = "MostafaNouh0011", email = "mostafanouh481@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.13",
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "fontools>=0.8.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.18.0",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
]

[project.scripts]
rag-document-agent = "rag_document_agent:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
